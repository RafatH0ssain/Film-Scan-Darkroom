[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "film-scan-darkroom"
version = "0.1.0"
description = "Turn a roll of scanned film negatives into finished positives: auto-crop, straighten, invert, sharpen, review."
readme = "README.md"
# Upper bound is native wheel availability (rawpy, pillow-heif), not a language
# requirement. Untested above 3.13; raise it once those ship wheels you have seen.
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Rafat Hossain" }]
keywords = ["film", "scanning", "negative", "darkroom", "batch", "photography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors",
]

# Kept in sync with requirements.txt. requirements.txt is what a newcomer runs;
# this is what pip needs to install the package itself.
dependencies = [
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<3",
    "Pillow>=10.0,<13",
    "tifffile>=2024.1,<2027",
    "rawpy>=0.22,<1",
    "pillow-heif>=0.16,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.scripts]
film-scan-darkroom = "fsd.app.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fsd = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:fsd.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
